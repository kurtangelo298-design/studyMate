<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="StudyMate PH — Your personal academic companion">
  <link rel="manifest" href="manifest.json">
  <title>StudyMate PH ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', Roboto, sans-serif;
    }

    :root {
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --accent: #8b5cf6;
      --bg: #f0f4ff;
      --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 50%, #fdf4ff 100%);
      --card: #ffffff;
      --text: #1e293b;
      --text-soft: #64748b;
      --border: #e0e7ff;
      --danger: #ef4444;
      --success: #10b981;
      --shadow-sm: 0 2px 8px rgba(37, 99, 235, 0.06);
      --shadow-md: 0 8px 24px rgba(37, 99, 235, 0.12);
      --shadow-lg: 0 16px 48px rgba(37, 99, 235, 0.15);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    body.dark-mode {
      --primary: #60a5fa;
      --primary-light: #93c5fd;
      --primary-soft: rgba(96, 165, 250, 0.15);
      --accent: #a78bfa;
      --bg: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e1b4b 100%);
      --card: #1e293b;
      --text: #f1f5f9;
      --text-soft: #94a3b8;
      --border: #334155;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.45);
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== MENU BUTTON — Floating ===== */
    .menu-toggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      font-size: 1.3rem;
      padding: 0.65rem 1rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      z-index: 100;
      box-shadow: var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .menu-toggle:hover {
      transform: scale(1.08);
      box-shadow: var(--shadow-lg);
    }
    .menu-toggle:active {
      transform: scale(0.95);
    }

    /* ===== OVERLAY ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(6px);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* ===== SIDEBAR — Glass Morphism + Animation ===== */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 300px;
      max-width: 88vw;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(37, 99, 235, 0.1);
      transform: translateX(-105%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
      padding: 1.5rem;
      overflow-y: auto;
    }
    body.dark-mode .sidebar {
      background: rgba(30, 41, 59, 0.85);
      border-right: 1px solid rgba(96, 165, 250, 0.15);
    }
    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 0.5rem 0 1rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h2 {
      font-size: 1.25rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
    .close-btn {
      background: var(--primary-soft);
      border: none;
      font-size: 1.3rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    .close-btn:hover {
      background: var(--danger);
      color: white;
      transform: rotate(90deg);
    }

    .nav-links {
      list-style: none;
    }
    .nav-links li {
      padding: 1rem 1.25rem;
      margin: 0.35rem 0;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 0.98rem;
      font-weight: 500;
      position: relative;
      overflow: hidden;
    }
    .nav-links li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: linear-gradient(180deg, var(--primary), var(--accent));
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }
    .nav-links li:hover, .nav-links li.active {
      background: var(--primary-soft);
      color: var(--primary);
      transform: translateX(4px);
    }
    .nav-links li.active::before,
    .nav-links li:hover::before {
      transform: scaleY(1);
    }

    .dark-toggle {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .dark-toggle button {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary-soft);
      color: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .dark-toggle button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      padding: 1.25rem;
      padding-top: 5rem;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .section {
      display: none;
      animation: fadeSlideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .section.active {
      display: block;
    }
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 1.75rem;
      text-align: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
    }

    /* ===== ADD BUTTON — Aesthetic ===== */
    .add-btn-container {
      text-align: center;
      margin-bottom: 2rem;
    }
    .add-toggle-btn {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .add-toggle-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: var(--shadow-lg);
    }
    .add-toggle-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* ===== FORM BOX — Smooth Expand Animation ===== */
    .form-box {
      background: var(--card);
      padding: 1.75rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      box-shadow: var(--shadow-md);
      width: 100%;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-10px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .form-box.show {
      max-height: 600px;
      opacity: 1;
      transform: translateY(0);
    }

    .form-box input, .form-box textarea, .form-box select {
      width: 100%;
      padding: 0.95rem 1rem;
      margin: 0.5rem 0;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
    }
    .form-box input:focus, .form-box textarea:focus, .form-box select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    .form-box textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .btn-group button {
      flex: 1;
      padding: 0.95rem;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .save-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
    }
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .cancel-btn {
      background: transparent;
      color: var(--danger);
      border: 2px solid var(--danger);
    }
    .cancel-btn:hover {
      background: var(--danger);
      color: white;
    }

    /* ===== LIST CONTAINER ===== */
    .list-container {
      background: var(--card);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      width: 100%;
    }
    .list-container h3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .list-container ul {
      list-style: none;
      margin-top: 1rem;
    }
    .list-container li {
      padding: 1.15rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: 100%;
      transition: all 0.25s ease;
      animation: listItemFadeIn 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes listItemFadeIn {
      to { opacity: 1; }
    }
    .list-container li:hover {
      background: var(--primary-soft);
      border-radius: var(--radius-sm);
      transform: translateX(6px);
    }
    .list-container li > div {
      flex: 1;
      min-width: 180px;
      word-wrap: break-word;
    }
    .list-container li strong {
      font-size: 1rem;
      display: block;
      margin-bottom: 0.25rem;
    }
    .list-container li:last-child {
      border-bottom: none;
    }

    .delete-btn {
      padding: 0.6rem 1rem;
      background: transparent;
      color: var(--danger);
      border: 2px solid var(--danger);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .delete-btn:hover {
      background: var(--danger);
      color: white;
      transform: scale(1.05);
    }

    .empty-msg {
      color: var(--text-soft);
      font-style: italic;
      text-align: center;
      padding: 2.5rem 1rem;
    }
    .empty-msg span {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
      opacity: 0.5;
    }

    /* ===== OFFLINE BADGE ===== */
    .offline-badge {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--success);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 99;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .offline-badge.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Offline Badge -->
  <div class="offline-badge" id="offlineBadge">✅ Ready for Offline Use</div>

  <div class="overlay" id="overlay"></div>
  <button class="menu-toggle" id="menuBtn">☰</button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>✨ StudyMate PH</h2>
      <button class="close-btn" id="closeBtn">×</button>
    </div>
    <ul class="nav-links">
      <li data-target="schedule" class="active">📅 Class Schedule</li>
      <li data-target="assignments">📝 Assignments</li>
      <li data-target="projects">📊 Project Tracker</li>
    </ul>
    <div class="dark-toggle">
      <button id="darkModeBtn">🌙 Dark Mode</button>
    </div>
  </nav>

  <main class="content">

    <!-- 📅 SCHEDULE -->
    <section id="schedule" class="section active">
      <h1>📅 Class Schedule</h1>
      <div class="add-btn-container">
        <button class="add-toggle-btn" id="showSchedFormBtn">➕ Add New Schedule</button>
      </div>
      <div class="form-box" id="schedFormBox">
        <h3>📅 New Schedule</h3>
        <input type="text" id="schedSubject" placeholder="Subject Name" required>
        <select id="schedDay">
          <option value="">-- Select Day --</option>
          <option>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
          <option>Saturday</option>
        </select>
        <input type="time" id="schedStart" required>
        <input type="time" id="schedEnd" required>
        <div class="btn-group">
          <button class="save-btn" id="addSchedBtn">✅ Save</button>
          <button class="cancel-btn" id="hideSchedFormBtn">✕ Cancel</button>
        </div>
      </div>
      <div class="list-container">
        <h3>📋 My Schedule</h3>
        <ul id="scheduleList"></ul>
      </div>
    </section>

    <!-- 📝 ASSIGNMENTS -->
    <section id="assignments" class="section">
      <h1>📝 Assignments & Deadlines</h1>
      <div class="add-btn-container">
        <button class="add-toggle-btn" id="showAssignFormBtn">➕ Add New Assignment</button>
      </div>
      <div class="form-box" id="assignFormBox">
        <h3>📝 New Assignment</h3>
        <input type="text" id="assignTitle" placeholder="Assignment Title" required>
        <textarea id="assignDesc" placeholder="Description (optional)"></textarea>
        <input type="date" id="assignDue" required>
        <div class="btn-group">
          <button class="save-btn" id="addAssignBtn">✅ Save</button>
          <button class="cancel-btn" id="hideAssignFormBtn">✕ Cancel</button>
        </div>
      </div>
      <div class="list-container">
        <h3>📋 My Assignments</h3>
        <ul id="assignList"></ul>
      </div>
    </section>

    <!-- 📊 PROJECTS -->
    <section id="projects" class="section">
      <h1>📊 Group Project Tracker</h1>
      <div class="add-btn-container">
        <button class="add-toggle-btn" id="showProjFormBtn">➕ Add New Project</button>
      </div>
      <div class="form-box" id="projFormBox">
        <h3>📊 New Project</h3>
        <input type="text" id="projName" placeholder="Project Name" required>
        <input type="text" id="projMembers" placeholder="Members (comma separated)">
        <input type="date" id="projDeadline" required>
        <div class="btn-group">
          <button class="save-btn" id="addProjBtn">✅ Save</button>
          <button class="cancel-btn" id="hideProjFormBtn">✕ Cancel</button>
        </div>
      </div>
      <div class="list-container">
        <h3>📋 My Projects</h3>
        <ul id="projList"></ul>
      </div>
    </section>

  </main>

  <script>
    // ===== DATA STORAGE — PERMANENT EVEN OFFLINE =====
    function getData(key) {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch { return []; }
    }
    function saveData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
      renderAll();
    }

    // ===== SIDEBAR =====
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }
    menuBtn.addEventListener('click', openSidebar);
    closeBtn.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    // ===== NAVIGATION =====
    document.querySelectorAll('.nav-links li').forEach(link => {
      link.addEventListener('click', () => {
        const targetId = link.getAttribute('data-target');
        document.querySelectorAll('.nav-links li').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(targetId).classList.add('active');
        closeSidebar();
      });
    });

    // ===== DARK MODE =====
    document.getElementById('darkModeBtn').addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      this.textContent = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    });
    // Load saved dark mode
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      document.getElementById('darkModeBtn').textContent = '☀️ Light Mode';
    }

    // ==================================================
    // 📅 SCHEDULE — Show/Hide Form
    // ==================================================
    const schedForm = document.getElementById('schedFormBox');
    document.getElementById('showSchedFormBtn').onclick = () => schedForm.classList.add('show');
    document.getElementById('hideSchedFormBtn').onclick = () => {
      schedForm.classList.remove('show');
      ['schedSubject','schedDay','schedStart','schedEnd'].forEach(id=>document.getElementById(id).value='');
    };
    document.getElementById('addSchedBtn').onclick = () => {
      const subject = document.getElementById('schedSubject').value.trim();
      const day = document.getElementById('schedDay').value;
      const start = document.getElementById('schedStart').value;
      const end = document.getElementById('schedEnd').value;
      if (!subject || !day || !start || !end) return alert('Punan ang lahat!');
      const data = getData('schedule');
      data.push({ subject, day, start, end });
      saveData('schedule', data);
      schedForm.classList.remove('show');
      ['schedSubject','schedDay','schedStart','schedEnd'].forEach(id=>document.getElementById(id).value='');
    };
    function renderSchedule() {
      const list = document.getElementById('scheduleList');
      const data = getData('schedule');
      list.innerHTML = data.length === 0
        ? '<li class="empty-msg"><span>📅</span>No schedule added yet.</li>'
        : data.map((item, i) => `
          <li style="animation-delay: ${i * 60}ms">
            <div><strong>${item.subject}</strong>${item.day} — ${item.start} to ${item.end}</div>
            <button class="delete-btn" data-key="schedule" data-idx="${i}">Delete</button>
          </li>`).join('');
    }

    // ==================================================
    // 📝 ASSIGNMENTS — Show/Hide Form
    // ==================================================
    const assignForm = document.getElementById('assignFormBox');
    document.getElementById('showAssignFormBtn').onclick = () => assignForm.classList.add('show');
    document.getElementById('hideAssignFormBtn').onclick = () => {
      assignForm.classList.remove('show');
      ['assignTitle','assignDesc','assignDue'].forEach(id=>document.getElementById(id).value='');
    };
    document.getElementById('addAssignBtn').onclick = () => {
      const title = document.getElementById('assignTitle').value.trim();
      const desc = document.getElementById('assignDesc').value.trim();
      const due = document.getElementById('assignDue').value;
      if (!title || !due) return alert('Punan ang Title at Due Date!');
      const data = getData('assignments');
      data.push({ title, desc, due });
      saveData('assignments', data);
      assignForm.classList.remove('show');
      ['assignTitle','assignDesc','assignDue'].forEach(id=>document.getElementById(id).value='');
    };
    function renderAssignments() {
      const list = document.getElementById('assignList');
      const data = getData('assignments');
      list.innerHTML = data.length === 0
        ? '<li class="empty-msg"><span>📝</span>No assignments added yet.</li>'
        : data.map((item, i) => `
          <li style="animation-delay: ${i * 60}ms">
            <div><strong>${item.title}</strong>${item.desc ? item.desc+'<br>' : ''}📅 Due: ${item.due}</div>
            <button class="delete-btn" data-key="assignments" data-idx="${i}">Delete</button>
          </li>`).join('');
    }

    // ==================================================
    // 📊 PROJECTS — Show/Hide Form
    // ==================================================
    const projForm = document.getElementById('projFormBox');
    document.getElementById('showProjFormBtn').onclick = () => projForm.classList.add('show');
    document.getElementById('hideProjFormBtn').onclick = () => {
      projForm.classList.remove('show');
      ['projName','projMembers','projDeadline'].forEach(id=>document.getElementById(id).value='');
    };
    document.getElementById('addProjBtn').onclick = () => {
      const name = document.getElementById('projName').value.trim();
      const members = document.getElementById('projMembers').value.trim();
      const deadline = document.getElementById('projDeadline').value;
      if (!name || !deadline) return alert('Punan ang Project Name at Deadline!');
      const data = getData('projects');
      data.push({ name, members, deadline });
      saveData('projects', data);
      projForm.classList.remove('show');
      ['projName','projMembers','projDeadline'].forEach(id=>document.getElementById(id).value='');
    };
    function renderProjects() {
      const list = document.getElementById('projList');
      const data = getData('projects');
      list.innerHTML = data.length === 0
        ? '<li class="empty-msg"><span>📊</span>No projects added yet.</li>'
        : data.map((item, i) => `
          <li style="animation-delay: ${i * 60}ms">
            <div><strong>${item.name}</strong>${item.members ? '👥 '+item.members+'<br>' : ''}📅 Deadline: ${item.deadline}</div>
            <button class="delete-btn" data-key="projects" data-idx="${i}">Delete</button>
          </li>`).join('');
    }

    // ===== DELETE =====
    document.addEventListener('click', e => {
      if (e.target.classList.contains('delete-btn')) {
        const key = e.target.dataset.key;
        const idx = parseInt(e.target.dataset.idx);
        const data = getData(key);
        data.splice(idx, 1);
        saveData(key, data);
      }
    });

    // ===== OFFLINE DETECTION & BADGE =====
    const offlineBadge = document.getElementById('offlineBadge');
    window.addEventListener('load', () => {
      setTimeout(() => offlineBadge.classList.add('show'), 500);
      setTimeout(() => offlineBadge.classList.remove('show'), 3500);
    });

    // ===== INITIAL LOAD =====
    function renderAll() {
      renderSchedule();
      renderAssignments();
      renderProjects();
    }
    renderAll();
  </script>
</body>
</html>
